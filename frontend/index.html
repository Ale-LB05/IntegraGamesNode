<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IntegraGames - Inicio</title>

    <link rel="icon" href="/img/logo.png" type="image/png" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: url("https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=2070&auto=format&fit=crop")
          no-repeat center center fixed;
        background-size: cover;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .overlay {
        position: absolute;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          135deg,
          rgba(0, 0, 0, 0.9),
          rgba(0, 0, 0, 0.7)
        );
        z-index: -1;
      }

      .main-container {
        text-align: center;
        max-width: 800px;
      }

      .logo-icon {
        font-size: 5rem;
        color: #00d2ff;
      }

      .main-title {
        font-size: 3rem;
        color: #00d2ff;
        font-weight: bold;
      }

      .subtitle {
        color: #ffffff; /* Agregué color blanco para que resalte sobre el fondo oscuro */
        font-size: 1.2rem;
      }

      .btn {
        background: linear-gradient(45deg, #00d2ff, #3a7bd5);
        border: none;
        padding: 15px 30px;
        border-radius: 50px;
        color: white;
      }

      .btn2 {
        background: linear-gradient(45deg, #ff6b6b, #ee5a5a);
      }

      .footer {
        margin-top: 40px;
        color: #aaa;
      }
    </style>
  </head>

  <body>
    <div class="overlay"></div>

    <div class="main-container">
      <div>
        <div class="logo-icon">
          <i class="fa-solid fa-gamepad"></i>
        </div>

        <h1 class="main-title">IntegraGames</h1>
        <p class="subtitle">La integración de la carrera a través del juego</p>
      </div>

      <div class="mt-4">
        <a href="/registroAlumnos/registro_alumno.html" class="btn">
          <i class="fa-solid fa-user-plus"></i> Registrarme
        </a>

        <a href="/registroAdmin/login.html" class="btn btn2">
          <i class="fa-solid fa-right-to-bracket"></i> Encargado
        </a>
      </div>

      <div class="footer">
        <p>&copy; <span id="year"></span> IntegraGames</p>
        <p>Desarrollado por alumnos TI</p>
      </div>
    </div>

    <script src="/js/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
