<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="icon" href="../img/logo.png" type="image/png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro Alumno - IntegraGames</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            border-radius: 15px;
        }

        .btn-primary {
            background: #00c6ff;
            border: none;
        }
    </style>
</head>

<body>

<div class="container">
<div class="row justify-content-center">
<div class="col-md-6">

<div class="card shadow-lg">
<div class="card-body p-5">

<div class="text-center mb-4">
    <h3>Registro de Alumno</h3>
    <p class="text-muted">IntegraGames</p>
</div>

<form id="formRegistro">

    <!-- NOMBRE -->
    <div class="mb-3">
        <label>Nombre</label>
        <input type="text" id="nombre" class="form-control" required>
    </div>

    <!-- EDAD -->
    <div class="mb-3">
        <label>Edad</label>
        <input type="number" id="edad" class="form-control" required>
    </div>

    <!-- ESCUELA -->
    <div class="mb-3">
        <label>Escuela</label>
        <select id="id_escuela" class="form-control" required>
            <option value="">Cargando escuelas...</option>
        </select>
    </div>

    <!-- EVENTO -->
    <div class="mb-3">
        <label>Evento</label>
        <select id="id_evento" class="form-control" required>
            <option value="">Cargando eventos...</option>
        </select>
    </div>

    <!-- BOTÓN -->
    <button type="submit" class="btn btn-primary w-100">
        <i class="fa-solid fa-user-plus"></i> Registrarme
    </button>

</form>

<hr>

<div class="text-center">
    <!--  CORRECCIÓN DE RUTA -->
    <a href="../index.html">
        <i class="fa-solid fa-arrow-left"></i> Volver al inicio
    </a>
</div>

</div>
</div>

</div>
</div>
</div>

<script src="registro_alumno.js"></script>

</body>
</html>
