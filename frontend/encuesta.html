<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Encuesta de Satisfacción | IntegraGames</title>
    <link rel="icon" href="/img/logo.png" />
    <link href="/css/styles.css" rel="stylesheet" />
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" />
    <link href="/css/sb-admin-2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        .stars i {
            font-size: 45px;
            cursor: pointer;
            color: #d1d3e2;
            transition: all 0.2s ease-in-out;
        }

        .stars i.active {
            color: #f6c23e;
            text-shadow: 0 0 10px rgba(246, 194, 62, 0.5);
            transform: scale(1.1);
        }

        .card-encuesta {
            max-width: 600px;
            margin: auto;
            border-radius: 20px;
            border: none;
        }

        .btn-enviar {
            border-radius: 50px;
            padding: 12px;
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>
</head>

<body id="page-top" class="bg-light">
    <div id="wrapper">

        <div id="content-wrapper" class="d-flex flex-column">
            <div id="content">
                
                <div class="container-fluid py-4">
                    <div class="card card-encuesta shadow-lg p-4">
                        <div class="text-center mb-4">
                            <i class="fas fa-clipboard-list fa-3x text-primary mb-3"></i>
                            <h3 class="fw-bold text-dark">Encuesta de Satisfacción</h3>
                            <p class="text-muted">Tu opinión es fundamental para mejorar.</p>
                        </div>

                        <form id="formEncuesta">
                            <div class="text-center mb-4 bg-white p-4 rounded-lg border">
                                <label class="h5 fw-bold text-dark mb-3">¿Qué calificación le das al juego?</label><br>
                                <div class="stars mb-2">
                                    <i class="fas fa-star" onclick="calificar(1)"></i>
                                    <i class="fas fa-star" onclick="calificar(2)"></i>
                                    <i class="fas fa-star" onclick="calificar(3)"></i>
                                    <i class="fas fa-star" onclick="calificar(4)"></i>
                                    <i class="fas fa-star" onclick="calificar(5)"></i>
                                </div>
                                <h5 id="label-puntos" class="text-primary fw-bold mt-3">0 / 10 puntos</h5>
                            </div>

                            <div class="form-group mb-4">
                                <label class="font-weight-bold text-dark"><i class="fas fa-comment-dots mr-1"></i> Comentario (Opcional)</label>
                                <textarea id="comentario" class="form-control bg-light" rows="3" placeholder="Cuéntanos tu experiencia..."></textarea>
                            </div>

                            <button type="submit" class="btn btn-success btn-block btn-enviar shadow">
                                <i class="fas fa-paper-plane mr-2"></i> Enviar mi opinión
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <script src="/vendor/jquery/jquery.min.js"></script>
    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/js/sb-admin-2.min.js"></script>

    <script>
        let ratingFinal = 0;
        const urlParams = new URLSearchParams(window.location.search);
        const idJuego = urlParams.get('id_juego');

        window.onload = () => {
            // Verificar si hay un ID de juego en la URL
            if (!idJuego || isNaN(idJuego)) {
                Swal.fire("Error", "No se ha seleccionado un juego válido para calificar.", "error").then(() => {
                    window.location.href = "/menu.html";
                });
                return;
            }

            // 1. Configurar barra superior
            const usuario = localStorage.getItem("usuario") || "Participante";
            const rol = (localStorage.getItem("rol") || "").toLowerCase();
            document.getElementById("nombreUsuarioTop").textContent = usuario + " - " + rol;

            // 2. Configurar la foto de perfil (con limpieza de rutas viejas)
            let foto = localStorage.getItem("foto");
            const imgTop = document.getElementById("imgUsuarioTop");
            
            if (!foto || foto === "undefined" || foto === "null" || foto.includes("user.jpg")) {
                foto = "/img/responsables/sinFoto.jpg";
            }
            if (imgTop) {
                imgTop.src = foto;
                imgTop.onerror = function() { this.src = "/img/responsables/sinFoto.jpg"; };
            }

            // 3. Seguridad: Si es un participante (alumno), ocultamos las opciones de administración
            if (rol === "participante") {
                document.querySelectorAll(".item-admin").forEach(el => el.style.display = "none");
            }
        };

        // Lógica visual de las estrellas
        function calificar(num) {
            ratingFinal = num * 2; // Convierte de 1-5 a 2-10 puntos
            document.getElementById("label-puntos").innerText = ratingFinal + " / 10 puntos";

            let stars = document.querySelectorAll(".stars i");
            stars.forEach((star, index) => {
                star.classList.toggle("active", index < num);
            });
        }

        // Envío del formulario hacia Node.js
        document.getElementById("formEncuesta").addEventListener("submit", async (e) => {
            e.preventDefault();

            if (ratingFinal === 0) {
                return Swal.fire({
                    icon: 'warning',
                    title: '¡Espera!',
                    text: 'Por favor, selecciona una calificación con las estrellas.',
                    confirmButtonColor: '#f6c23e'
                });
            }

            Swal.fire({
                title: 'Enviando...',
                text: 'Procesando tu opinión',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            const token = localStorage.getItem("token");
            const bodyData = {
                id_juego: parseInt(idJuego),
                calificacion: ratingFinal,
                comentario: document.getElementById("comentario").value.trim()
            };

            try {
                const res = await fetch("/api/guardar_encuesta", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}` // Autenticación del participante
                    },
                    body: JSON.stringify(bodyData)
                });

                const result = await res.json();

                if (result.success) {
                    Swal.fire({
                        icon: 'success',
                        title: '¡Enviado con éxito!',
                        text: 'Gracias por ayudarnos a mejorar IntegraGames.',
                        showConfirmButton: false,
                        timer: 2500
                    }).then(() => {
                        window.location.href = "/menu.html"; // Regresa al menú al terminar
                    });
                } else {
                    Swal.fire("Error", result.error || "No se pudo guardar la encuesta", "error");
                }
            } catch (err) {
                Swal.fire("Error", "Error de conexión con el servidor", "error");
            }
        });

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = "/registroAdmin/login.html";
        }
    </script>
</body>
</html>
