<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Encuesta de Satisfacción | IntegraGames</title>
    <link rel="icon" href="/img/logo.png" type="image/png">
    <link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { background: #eef4ff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        .stars i {
            font-size: 40px;
            cursor: pointer;
            color: #ccc;
            transition: 0.2s;
            margin: 0 5px;
        }

        .stars i.active {
            color: gold;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .card {
            max-width: 500px;
            margin: auto;
            border-radius: 20px;
            border: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1) !important;
        }

        .btn-success {
            border-radius: 50px;
            padding: 12px;
            font-weight: bold;
            background-color: #1cc88a;
            border-color: #1cc88a;
        }
        
        .btn-success:hover {
            background-color: #17a673;
            border-color: #169b6b;
        }
    </style>
</head>

<body class="d-flex align-items-center" style="min-height: 100vh;">

    <div class="container">
        <div class="card p-4 p-md-5">
            <h3 class="text-center mb-4 fw-bold" style="color: #2e384d;">Encuesta de satisfacción</h3>

            <form id="formEncuesta">
                <div class="text-center mb-4">
                    <label class="h5 text-secondary mb-3">¿Qué calificación le das?</label><br>
                    <div class="stars">
                        <i class="fas fa-star" onclick="calificar(1)"></i>
                        <i class="fas fa-star" onclick="calificar(2)"></i>
                        <i class="fas fa-star" onclick="calificar(3)"></i>
                        <i class="fas fa-star" onclick="calificar(4)"></i>
                        <i class="fas fa-star" onclick="calificar(5)"></i>
                    </div>
                    <p id="label-puntos" class="mt-3 text-muted font-weight-bold" style="font-size: 1.1rem;"></p>
                </div>

                <div class="form-group mb-4">
                    <label class="font-weight-bold text-secondary">Comentario (Opcional)</label>
                    <textarea id="comentario" class="form-control rounded-lg" rows="3" placeholder="Cuéntanos tu experiencia..." style="resize: none;"></textarea>
                </div>

                <button type="button" onclick="procesarEncuesta()" class="btn btn-success btn-block shadow-sm text-white">
                    <i class="fas fa-paper-plane mr-2"></i> Enviar mi opinión
                </button>
            </form>
        </div>
    </div>

    <script src="/vendor/jquery/jquery.min.js"></script>
    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/js/encuesta.js"></script>
</body>
</html>
